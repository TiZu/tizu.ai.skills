name: 🟣 Epic
description: A large body of work that can be broken down into smaller tasks or stories.
labels: ['type:epic', 'status:new']
title: "🟣 "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A detailed description of the epic.
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: Goals & Outcomes
      description: What measurable outcomes should be achieved?
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / Context
      description: Additional context, info, links, etc.
    validations:
      required: false

  - type: upload
    id: attachments
    attributes:
      label: Attachments
      description: Add any relevant files, such as screenshots or mockups.
    validations:
      required: false
